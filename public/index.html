<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Órbita · Motor multijugador para GameMaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0D17;
    --surface: #10162A;
    --surface-2: #151C33;
    --surface-3: #172040;
    --line: #1E2640;
    --line-2: #2C3657;
    --text: #E8ECF7;
    --text-2: #C9D2E8;
    --muted: #A7B2CC;
    --muted-2: #93A0BD;
    --nav: #B4BED6;
    --accent: #5EE6D0;
    --accent-ink: #071018;
    --violet: #8B7CFF;
    --gold: #F2C879;
    --ok: #5EE6A0;
    --danger: #FF9A9A;
    --danger-line: #4A2A33;
    --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: "Space Grotesk", Inter, system-ui, sans-serif;
    --mono: "JetBrains Mono", "Fira Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; }
  a { color: #8FB3FF; } a:hover { color: #B9CEFF; }
  h1, h2, h3 { font-family: var(--display); margin: 0; }
  code, pre, .mono { font-family: var(--mono); }
  p { margin: 0; }
  button { font: inherit; }
  [hidden] { display: none !important; }

  /* Botones */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: var(--accent-ink); border: none; font-weight: 600; font-size: 15px; padding: 13px 20px; border-radius: 10px; cursor: pointer; text-decoration: none; min-height: 44px; }
  .btn:hover { filter: brightness(1.08); color: var(--accent-ink); }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line-2); font-weight: 500; }
  .btn-ghost:hover { background: var(--surface-2); color: var(--text); filter: none; }
  .btn-soft { background: var(--surface-3); color: var(--text); border: 1px solid var(--line-2); font-weight: 500; }
  .btn-soft:hover { color: var(--text); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger-line); font-weight: 500; }
  .btn-danger:hover { background: #24131A; color: #FFB4B4; filter: none; }
  .btn-sm { font-size: 13.5px; padding: 9px 13px; min-height: 38px; border-radius: 9px; }
  .btn-lg { font-size: 16px; padding: 15px 26px; border-radius: 12px; }

  /* Barra superior */
  .topbar { border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 0; z-index: 20; }
  .topbar-in { padding: 14px 28px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
  .brand:hover { color: var(--text); }
  .brand b { font-family: var(--display); font-weight: 700; font-size: 21px; letter-spacing: .4px; }
  .pill { font-size: 13px; color: var(--muted-2); border: 1px solid var(--line-2); padding: 4px 10px; border-radius: 999px; }
  .pill-gold { color: var(--gold); border-color: #5A4A2A; }
  .nav { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .nav a:not(.btn), .nav button.link { color: var(--nav); text-decoration: none; font-size: 15px; padding: 12px 14px; background: none; border: none; cursor: pointer; border-radius: 8px; }
  .nav a:not(.btn):hover, .nav button.link:hover { color: var(--text); }
  .nav a.on { color: var(--text); font-weight: 500; box-shadow: inset 0 -2px 0 var(--accent); border-radius: 0; }
  .crumbs { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .crumbs .sep { color: #3A4566; }
  .crumbs a { color: var(--nav); text-decoration: none; padding: 8px 2px; }
  .crumbs strong { font-weight: 600; }
  .user-chip { font-size: 14px; color: var(--nav); }

  /* Pestañas de proyecto */
  .tabs { padding: 0 28px; display: flex; gap: 4px; flex-wrap: wrap; border-top: 1px solid transparent; }
  .tabs a { color: var(--nav); text-decoration: none; font-size: 15px; padding: 14px; }
  .tabs a:hover { color: var(--text); }
  .tabs a.on { color: var(--text); font-weight: 500; box-shadow: inset 0 -2px 0 var(--accent); }

  /* Diseño general */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
  .page { padding: 40px 0 72px; display: flex; flex-direction: column; gap: 24px; }
  .split { display: flex; flex-wrap: wrap; align-items: flex-start; min-height: calc(100vh - 140px); }
  .side { flex: 1 1 260px; max-width: 320px; padding: 24px 16px; display: flex; flex-direction: column; gap: 3px; }
  .main { flex: 999 1 560px; min-width: 0; padding: 28px 32px 56px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 22px; }
  .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .head h1 { font-size: 34px; }
  .sub { color: var(--muted); font-size: 15.5px; line-height: 1.6; }
  .eyebrow { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted-2); }

  /* Tarjetas */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
  .card-pad { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .card-head { padding: 16px 22px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .card-head h2 { font-size: 18px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 16px 22px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: none; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
  .stat span { font-size: 14px; color: var(--muted-2); }
  .stat b { font-family: var(--display); font-size: 30px; font-weight: 600; }
  .empty { padding: 30px 22px; color: var(--muted-2); text-align: center; }
  .note { display: flex; gap: 14px; background: #121A33; border: 1px solid #2A2F5E; border-radius: 14px; padding: 16px 20px; color: var(--text-2); line-height: 1.6; }

  /* Tablas */
  .tbl-box { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th { text-align: left; color: var(--muted-2); font-size: 13px; font-weight: 500; padding: 13px 14px; }
  td { padding: 13px 14px; border-top: 1px solid var(--line); vertical-align: middle; }
  th:first-child, td:first-child { padding-left: 22px; }
  th:last-child, td:last-child { padding-right: 22px; }
  td.r, th.r { text-align: right; white-space: nowrap; }

  /* Formularios */
  label.f { display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--nav); }
  input[type=text], input[type=email], input[type=password], input[type=search], select, textarea {
    background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; color: var(--text); font: inherit; font-size: 15px; padding: 12px 14px; min-height: 44px; width: 100%;
  }
  textarea { font-family: var(--mono); font-size: 13.5px; line-height: 1.6; min-height: 220px; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .form-row > label { flex: 1 1 280px; }

  /* Estados */
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5A6684; }
  .dot.on { background: var(--ok); }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted-2); }
  .status.on { color: var(--ok); }
  .tag { font-size: 12px; color: var(--gold); border: 1px solid #5A4A2A; padding: 2px 8px; border-radius: 999px; margin-left: 8px; }
  .tag-v { color: #C3BAFF; border-color: #3A3370; }
  .switch { width: 52px; height: 30px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface-3); position: relative; cursor: pointer; padding: 0; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: #5A6684; transition: left .15s; }
  .switch[aria-checked=true] { background: var(--accent); border-color: var(--accent); }
  .switch[aria-checked=true]::after { left: 25px; background: var(--accent-ink); }

  /* Código */
  pre.code { margin: 0; background: var(--surface); border: 1px solid #232C45; border-radius: 14px; padding: 18px 20px; font-size: 14px; line-height: 1.75; color: var(--text-2); overflow-x: auto; white-space: pre; position: relative; }
  .code-box { position: relative; }
  .code-box .btn { position: absolute; top: 10px; right: 10px; }
  .c-com { color: #7C88A6; } .c-str { color: var(--gold); }
  .keybox { flex: 1 1 280px; font-size: 14px; color: var(--text-2); background: var(--bg); border: 1px solid var(--line); padding: 11px 12px; border-radius: 9px; overflow-x: auto; white-space: nowrap; }

  /* Árbol */
  .tree-title { display: flex; align-items: center; gap: 10px; padding: 10px 12px; font-weight: 600; }
  .tree-group { display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 30px; color: var(--nav); font-size: 14.5px; }
  .tree-group .n { margin-left: auto; font-family: var(--mono); font-size: 12.5px; color: var(--muted-2); }
  .tree-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: none; border-radius: 10px; color: var(--nav); font-size: 14.5px; padding: 10px 12px 10px 56px; cursor: pointer; position: relative; min-height: 42px; }
  .tree-item::before { content: ""; position: absolute; left: 38px; top: 0; bottom: 0; width: 1px; background: var(--line-2); }
  .tree-item:hover { background: #111831; color: var(--text); }
  .tree-item.on { background: var(--surface-2); color: var(--text); }
  .tree-item.flat { padding-left: 16px; }
  .tree-item.flat::before { display: none; }
  .tree-item .n { margin-left: auto; font-size: 12.5px; color: var(--muted-2); }
  .tree-item .nm { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Proyectos */
  .grid-proj { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .proj { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 18px; text-decoration: none; color: var(--text); }
  .proj:hover { border-color: var(--line-2); color: var(--text); }
  .proj .ini { width: 48px; height: 48px; border-radius: 14px; background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--violet); flex: none; }
  .proj .nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; }
  .proj .nums span { font-size: 13px; color: var(--muted-2); display: block; }
  .proj .nums b { font-family: var(--display); font-size: 22px; font-weight: 600; }
  .proj-new { background: transparent; border: 1.5px dashed var(--line-2); border-radius: 18px; padding: 24px; min-height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--nav); font-size: 15.5px; cursor: pointer; }
  .proj-new:hover { border-color: var(--accent); color: var(--text); }

  /* Inicio */
  .hero { display: flex; flex-wrap: wrap; align-items: center; gap: 56px; padding: 90px 0 64px; }
  .hero h1 { font-size: clamp(40px, 6vw, 64px); line-height: 1.05; letter-spacing: -1.5px; }
  .hero p.lead { font-size: 19px; line-height: 1.6; color: var(--muted); max-width: 560px; }
  .feat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .feat h3 { font-size: 19px; }
  .feat p { color: var(--muted); line-height: 1.6; }
  .feat code { font-size: 13px; color: var(--accent); }
  .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-3); display: flex; align-items: center; justify-content: center; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; }
  .step { border: 1px solid var(--line); border-radius: 16px; padding: 26px; display: flex; flex-direction: column; gap: 10px; }
  .step .num { font-family: var(--mono); font-size: 14px; color: var(--accent); }
  .step p { color: var(--muted); line-height: 1.6; }

  /* Docs */
  .doc-cat { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 10px; text-decoration: none; color: var(--nav); background: none; border: none; text-align: left; cursor: pointer; font-size: 15px; width: 100%; }
  .doc-cat:hover { color: var(--text); background: #111831; }
  .doc-cat.on { background: var(--surface-2); color: var(--text); font-weight: 500; }
  .doc-cat .n { font-family: var(--mono); font-size: 13px; color: var(--muted-2); width: 22px; }
  .doc-cat.on .n { color: var(--accent); }
  .docs-main { max-width: 980px; }
  .fn { display: flex; flex-direction: column; gap: 12px; padding: 22px 0; border-top: 1px solid var(--line); }
  .fn h3 { font-family: var(--mono); font-size: 16px; font-weight: 500; color: var(--accent); word-break: break-word; }
  .fn p { color: var(--muted); line-height: 1.65; }
  .fn ul { margin: 0; padding-left: 20px; color: var(--text-2); line-height: 1.7; }
  .params { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .prm { display: flex; flex-wrap: wrap; gap: 6px 20px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .prm:first-child { border-top: none; }
  .prm code { flex: 0 0 240px; color: var(--text); font-size: 13.5px; word-break: break-word; }
  .prm span { flex: 1 1 280px; color: var(--muted); line-height: 1.6; }
  .ideas, .ojo { border-radius: 12px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
  .ideas { background: #10192B; border: 1px solid #1D3A44; }
  .ideas b { color: var(--accent); font-size: 14px; }
  .ojo { background: #1A1424; border: 1px solid #3A2A44; }
  .ojo b { color: var(--gold); font-size: 14px; }
  .ideas ul, .ojo ul { margin: 0; padding-left: 20px; color: var(--text-2); line-height: 1.7; }
  .fn li code, .fn p code, .prm span code, .sub code, .note code { color: var(--text); font-size: 13.5px; }

  /* Modal y aviso */
  .modal-bg { position: fixed; inset: 0; background: rgba(4,6,12,.72); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 16px; }
  .modal h2 { font-size: 24px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border: 1px solid var(--line-2); border-radius: 10px; padding: 4px; gap: 4px; }
  .seg button { background: none; border: none; color: var(--nav); padding: 10px; border-radius: 7px; cursor: pointer; min-height: 40px; }
  .seg button.on { background: var(--surface-3); color: var(--text); font-weight: 500; }
  .err { color: var(--danger); font-size: 14px; }
  #toast { position: fixed; bottom: 22px; right: 22px; background: var(--surface-2); border: 1px solid var(--line-2); padding: 13px 18px; border-radius: 10px; font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 99; max-width: 380px; }
  #toast.show { opacity: 1; }
  #toast.bad { border-color: var(--danger-line); color: #FFC9C9; }

  footer.foot { border-top: 1px solid var(--line); }
  footer.foot .wrap { padding: 26px 32px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; color: var(--muted-2); font-size: 14px; }

  @media (max-width: 720px) {
    .topbar-in, .tabs { padding-left: 16px; padding-right: 16px; }
    .wrap { padding: 0 18px; }
    .main { padding: 22px 18px 48px; border-left: none; border-top: 1px solid var(--line); }
    .side { max-width: none; }
    .hero { padding-top: 48px; }
  }
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<div id="app"></div>

<!-- Entrar / registrarse (desarrolladores) -->
<div class="modal-bg" id="auth-modal" hidden>
  <form class="modal" id="auth-form" autocomplete="on">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
      <h2 id="auth-title">Entrar al Dashboard</h2>
      <button type="button" class="btn btn-ghost btn-sm" data-close="auth-modal" aria-label="Cerrar">✕</button>
    </div>
    <div class="seg" role="tablist">
      <button type="button" id="auth-tab-login" class="on" role="tab">Iniciar sesión</button>
      <button type="button" id="auth-tab-register" role="tab">Crear cuenta</button>
    </div>
    <label class="f" id="auth-name-wrap" hidden>Tu nombre o el de tu estudio
      <input type="text" id="auth-name" maxlength="48" autocomplete="name">
    </label>
    <label class="f">Correo
      <input type="email" id="auth-email" maxlength="96" autocomplete="email" required>
    </label>
    <label class="f">Contraseña
      <input type="password" id="auth-pass" maxlength="128" autocomplete="current-password" required>
    </label>
    <p class="err" id="auth-err" hidden></p>
    <button type="submit" class="btn" id="auth-submit">Entrar</button>
    <p class="sub" style="font-size:14px;">¿Eres el dueño del servidor? <a href="#/admin">Entrar como administrador</a></p>
  </form>
</div>

<!-- Token de admin -->
<div class="modal-bg" id="admin-modal" hidden>
  <form class="modal" id="admin-form">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
      <h2>Administrador</h2>
      <a class="btn btn-ghost btn-sm" href="#/" aria-label="Cerrar">✕</a>
    </div>
    <p class="sub">Escribe el <code>ADMIN_TOKEN</code> que pusiste al arrancar el servidor.</p>
    <label class="f">Token de administrador
      <input type="password" id="admin-token" autocomplete="off" required>
    </label>
    <p class="err" id="admin-err" hidden></p>
    <button type="submit" class="btn">Entrar</button>
  </form>
</div>

<!-- Editor JSON (base de datos y objetos del mundo) -->
<div class="modal-bg" id="json-modal" hidden>
  <form class="modal" id="json-form" style="max-width:680px;">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
      <h2 id="json-title">Editar</h2>
      <button type="button" class="btn btn-ghost btn-sm" data-close="json-modal" aria-label="Cerrar">✕</button>
    </div>
    <label class="f" id="json-key-wrap">Clave del documento
      <input type="text" id="json-key" maxlength="128">
    </label>
    <label class="f">Valor (JSON)
      <textarea id="json-value" spellcheck="false"></textarea>
    </label>
    <p class="err" id="json-err" hidden></p>
    <div style="display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;">
      <button type="button" class="btn btn-ghost" data-close="json-modal">Cancelar</button>
      <button type="submit" class="btn">Guardar</button>
    </div>
  </form>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
// =====================================================================
// ÓRBITA · Panel web (inicio, dashboard de proyectos, documentación y admin)
// Todo en un archivo, sin librerías. Las rutas van en el # de la URL.
// =====================================================================

const $ = (sel, root = document) => root.querySelector(sel);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtJson = (v) => { try { return JSON.stringify(v); } catch { return String(v); } };
const short = (s, n = 90) => (s.length > n ? s.slice(0, n - 1) + "…" : s);
const initials = (name) => String(name || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase() || "?";
const mask = (uuid) => uuid.slice(0, 13) + "-••••-••••-••••••••••••";

const LOGO = `<svg width="32" height="32" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="6" fill="#5EE6D0"></circle><ellipse cx="17" cy="17" rx="15" ry="7" fill="none" stroke="#8B7CFF" stroke-width="1.6" transform="rotate(-24 17 17)"></ellipse></svg>`;
const ICON_ORBIT = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B7CFF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(-25 12 12)"></ellipse></svg>`;
const ICON_INFO = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B7CFF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16v.5"></path></svg>`;

// ---------------------------------------------------------------------
// Sesión (se guarda en este navegador)
// ---------------------------------------------------------------------
const S = { dev: "", admin: "", user: null, timer: null, sel: {} };
try { S.dev = localStorage.getItem("orbita_dev_token") || ""; } catch {}
try { S.admin = sessionStorage.getItem("orbita_admin_token") || ""; } catch {}
function saveDev(t) { S.dev = t; try { t ? localStorage.setItem("orbita_dev_token", t) : localStorage.removeItem("orbita_dev_token"); } catch {} }
function saveAdmin(t) { S.admin = t; try { t ? sessionStorage.setItem("orbita_admin_token", t) : sessionStorage.removeItem("orbita_admin_token"); } catch {} }

// ---------------------------------------------------------------------
// Llamadas al servidor
// ---------------------------------------------------------------------
async function call(path, { method = "GET", body, token, kind } = {}) {
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (res.status === 401 && kind === "dev") { saveDev(""); S.user = null; openAuth(); throw new Error("Tu sesión se venció. Entra otra vez."); }
  if ((res.status === 401 || res.status === 503) && kind === "admin") { saveAdmin(""); showAdminModal(data.error || ""); throw new Error(data.error || "Token incorrecto"); }
  if (!res.ok || data.ok === false) throw new Error(data.error || data.d || `Error ${res.status}`);
  return data;
}
const dev = (p, o = {}) => call(p, { ...o, token: S.dev, kind: "dev" });
const adm = (p, o = {}) => call(p, { ...o, token: S.admin, kind: "admin" });

// ---------------------------------------------------------------------
// Avisos, modales y preguntas
// ---------------------------------------------------------------------
let toastTimer = null;
function toast(msg, bad = false) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.toggle("bad", bad);
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}
const fail = (e) => toast(e.message || String(e), true);
function copy(txt, msg = "Copiado") {
  navigator.clipboard.writeText(txt).then(() => toast(msg), () => toast("No se pudo copiar", true));
}
document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-close]");
  if (c) $("#" + c.dataset.close).hidden = true;
});

// Pregunta con un campo de texto o confirmación. Devuelve el texto, true, o null si cancela.
function ask({ title, text = "", label = "", value = "", placeholder = "", confirm = "Aceptar", danger = false, mustType = "" }) {
  return new Promise((resolve) => {
    const bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = `<form class="modal">
      <h2>${esc(title)}</h2>
      ${text ? `<p class="sub">${text}</p>` : ""}
      ${label || mustType ? `<label class="f">${esc(label || `Escribe «${mustType}» para confirmar`)}<input type="text" maxlength="64" value="${esc(value)}" placeholder="${esc(placeholder)}"></label>` : ""}
      <div style="display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap;">
        <button type="button" class="btn btn-ghost" data-x>Cancelar</button>
        <button type="submit" class="btn ${danger ? "btn-danger" : ""}">${esc(confirm)}</button>
      </div></form>`;
    document.body.appendChild(bg);
    const input = bg.querySelector("input");
    (input || bg.querySelector("button[type=submit]")).focus();
    const done = (v) => { bg.remove(); resolve(v); };
    bg.querySelector("[data-x]").onclick = () => done(null);
    bg.querySelector("form").onsubmit = (ev) => {
      ev.preventDefault();
      if (mustType) return input.value.trim() === mustType ? done(true) : toast(`Escribe exactamente «${mustType}»`, true);
      if (input) return input.value.trim() ? done(input.value.trim()) : input.focus();
      done(true);
    };
  });
}

// Editor JSON reutilizable (documentos de base de datos y objetos del mundo)
function editJson({ title, key = null, keyEditable = false, value, onSave }) {
  $("#json-title").textContent = title;
  $("#json-key-wrap").hidden = key === null;
  $("#json-key").value = key || "";
  $("#json-key").readOnly = !keyEditable;
  $("#json-value").value = value === undefined ? "{\n  \n}" : JSON.stringify(value, null, 2);
  $("#json-err").hidden = true;
  $("#json-modal").hidden = false;
  (keyEditable ? $("#json-key") : $("#json-value")).focus();
  $("#json-form").onsubmit = async (ev) => {
    ev.preventDefault();
    let v;
    try { v = JSON.parse($("#json-value").value); } catch { $("#json-err").textContent = "Eso no es JSON válido (revisa comillas y comas)."; $("#json-err").hidden = false; return; }
    const k = $("#json-key").value.trim();
    if (key !== null && !k) { $("#json-err").textContent = "Ponle una clave al documento."; $("#json-err").hidden = false; return; }
    try { await onSave(k, v); $("#json-modal").hidden = true; } catch (e) { $("#json-err").textContent = e.message; $("#json-err").hidden = false; }
  };
}

let authMode = "login";
function setAuthMode(mode) {
  authMode = mode;
  $("#auth-tab-login").classList.toggle("on", mode === "login");

  $("#auth-name-wrap").hidden = mode !== "register";

}

$("#auth-tab-register").onclick = () => setAuthMode("register");

  try {
    const r = await call(authMode === "login" ? "/api/dev/login" : "/api/dev/register", { method: "POST", body });

    S.user = r.user;
    $("#auth-modal").hidden = true;
    $("#auth-pass").value = "";

    if (location.hash === "#/proyectos") render();
  } catch (e) {

  }
};
function logoutDev() { saveDev(""); S.user = null; location.hash = "#/"; }
async function ensureUser() {
  if (!S.user && S.dev) { const r = await dev("/api/dev/me"); S.user = r.user; }
  return S.user;
}

function showAdminModal(msg = "") {
  $("#admin-err").textContent = msg.startsWith("admin_disabled") ? "El panel de admin está apagado: arranca el servidor con la variable ADMIN_TOKEN." : msg ? "Token incorrecto." : "";

}
$("#admin-form").onsubmit = (ev) => {
  ev.preventDefault();
  saveAdmin($("#admin-token").value.trim());
  $("#admin-token").value = "";
  $("#admin-modal").hidden = true;
  render();
};

function route() {

// ---------------------------------------------------------------------
// Proyecto · SALAS EN VIVO (árbol: proyecto ▸ versión ▸ salas)
// ---------------------------------------------------------------------
function playerName(p) {
  const s = p.state || {};
  return s.nombre || s.name || s.nick || "—";
}
async function tabSalas(P) {
  const sel = (S.sel[P.id] ||= {});
  const all = [];
  for (const c of P.channels) for (const r of c.rooms) all.push({ ns: c.ns, ver: c.gameId, room: r });
  let cur = all.find((x) => x.ns === sel.ns && x.room.id === sel.room) || all[0];
  if (cur) { sel.ns = cur.ns; sel.room = cur.room.id; }

  const tree = `<aside class="side" aria-label="Árbol del proyecto">
    <div class="tree-title">${CHEV_DOWN.replace("#93A0BD", "#8B7CFF")}${esc(P.name)}</div>
    ${P.channels.length ? P.channels.map((c) => `
      <div class="tree-group">${CHEV_DOWN}Versión <span class="tag tag-v" style="margin:0">${esc(c.gameId)}</span><span class="n">${c.rooms.length}</span></div>
      ${c.rooms.length ? c.rooms.map((r) => {
        const on = cur && cur.ns === c.ns && cur.room.id === r.id;
        return `<button type="button" class="tree-item ${on ? "on" : ""}" data-act="pick-room" data-ns="${esc(c.ns)}" data-room="${esc(r.id)}" ${on ? 'aria-current="true"' : ""}>
          <span class="dot on"></span><span class="nm">${esc(r.id)}</span><span class="n">${r.players.length}${r.max ? "/" + r.max : ""}</span></button>`;
      }).join("") : `<p class="sub" style="padding:6px 12px 6px 56px; font-size:13.5px;">Sin salas abiertas</p>`}
      ${c.queues.filter((q) => q.waiting).map((q) => `<div class="tree-group" style="padding-left:56px; font-size:13.5px">Buscando partida: ${esc(q.mode)} · ${q.waiting}/${q.size}</div>`).join("")}
    `).join("") : `<p class="sub" style="padding:8px 12px 8px 30px; font-size:14px;">Todavía nadie se ha conectado a este proyecto.</p>`}
    <a class="tree-group" style="text-decoration:none; margin-top:8px" href="#/proyecto/${esc(P.id)}/datos">Base de datos<span class="n">${P.collections.length}</span></a>
  </aside>`;

  let detail;
  if (!cur) {
    detail = `<div class="card card-pad">
      <h2 style="font-size:22px;">No hay salas abiertas ahora</h2>
      <p class="sub">Cuando alguien entre a una sala con <code>orb_join_room</code> o con partida rápida, aparece aquí al momento. Para conectar tu juego:</p>
      <pre class="code">${connectSnippet(P.keyList?.[0]?.uuid ? "[clave de Desarrollo]" : "[TU CLAVE]")}</pre>
      <a class="btn btn-ghost" style="align-self:flex-start" href="#/proyecto/${esc(P.id)}/claves">Ver mis claves</a>
    </div>`;
  } else {
    const r = cur.room;
    let objs = {};
    try { objs = (await dev(`/api/dev/world/${encodeURIComponent(cur.ns)}/${encodeURIComponent(r.id)}`)).data || {}; } catch {}
    S.ctx = { api: dev, worldBase: `/api/dev/world/${encodeURIComponent(cur.ns)}/${encodeURIComponent(r.id)}`, kickPath: "/api/dev/kick", after: () => render() };
    const objList = Object.entries(objs);
    detail = `
      <div class="head" style="align-items:flex-start">
        <div style="display:flex; flex-direction:column; gap:8px;">
          <span class="eyebrow">Sala · versión ${esc(cur.ver)}</span>
          <h1 class="mono" style="font-size:30px; font-weight:500; font-family:var(--mono)">${esc(r.id)}</h1>
          <div style="display:flex; gap:10px; flex-wrap:wrap; font-size:14px; color:var(--nav);">
            <span class="pill">${r.players.length}${r.max ? "/" + r.max : ""} jugadores</span>
            <span class="pill">Host: #${esc(r.host)}</span>
            <span class="pill">${r.id.startsWith("match_") ? "Partida rápida" : "Sala normal"}</span>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" type="button" data-act="refresh">Actualizar</button>
      </div>
      <section class="card">
        <div class="card-head"><h2>Jugadores</h2></div>
        <div class="tbl-box"><table style="min-width:620px">
          <thead><tr><th>Id</th><th>Puesto</th><th>Nombre (estado)</th><th>Entidades</th><th class="r">Acción</th></tr></thead>
          <tbody>${r.players.map((p) => `<tr>
            <td class="mono">#${esc(p.id)}</td><td>${esc(p.slot)}</td>
            <td>${esc(playerName(p))}${p.id === r.host ? '<span class="tag">HOST</span>' : ""}</td>
            <td style="color:var(--nav)">${esc(p.entities ?? 0)}</td>
            <td class="r"><button class="btn btn-danger btn-sm" type="button" data-act="kick" data-id="${esc(p.id)}">Expulsar</button></td>
          </tr>`).join("")}</tbody></table></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Objetos del mundo en esta sala</h2><button class="btn btn-soft btn-sm" type="button" data-act="obj-new">+ Crear objeto</button></div>
        ${objList.length ? objList.map(([id, p]) => `<div class="row">
            <span class="mono" style="color:var(--muted-2); width:52px">#${esc(id)}</span>
            <span style="font-weight:500; min-width:110px">${esc(p.tipo || p.type || p.kind || "objeto")}</span>
            <code class="keybox" style="font-size:13px">${esc(short(fmtJson(p), 140))}</code>
            <span style="display:flex; gap:6px;"><button class="btn btn-soft btn-sm" type="button" data-act="obj-edit" data-id="${esc(id)}">Editar</button><button class="btn btn-danger btn-sm" type="button" data-act="obj-del" data-id="${esc(id)}">Borrar</button></span>
          </div>`).join("") : `<p class="empty">Esta sala no tiene objetos guardados.</p>`}
      </section>`;
    S.objs = objs;
  }
  $("#app").innerHTML = `<div class="split">${tree}<main class="main">${detail}</main></div>`;
  every(3000, async () => {
    if ($("#json-modal").hidden === false) return;
    try { const { project } = await dev(`/api/dev/projects/${encodeURIComponent(P.id)}`); if (route().b === "salas" || !route().b) await tabSalas(project); } catch {}
  });
}

// ---------------------------------------------------------------------
// Editor de base de datos (lo usan el proyecto y el admin)
// ---------------------------------------------------------------------
async function dbPanel(el, { api, base, selKey, note = "" }) {
  const { data } = await api(base);
  const cols = Object.keys(data || {}).sort();
  let col = S.sel[selKey];
  if (!cols.includes(col)) col = cols[0];
  S.sel[selKey] = col;
  S.db = { api, base, data, col, selKey, reload: () => dbPanel(el, { api, base, selKey, note }).catch(fail) };
  const docs = col ? Object.entries(data[col] || {}) : [];
  const kind = (c) => c.startsWith("_") || c.startsWith("priv_") ? '<span class="tag" title="Solo el servidor">privada</span>' : c.startsWith("ro_") ? '<span class="tag tag-v" title="Los jugadores solo leen">solo lectura</span>' : "";
  el.innerHTML = `<div class="split" style="min-height:auto">
    <aside class="side" aria-label="Colecciones">
      <div class="tree-title">Colecciones</div>
      ${cols.map((c) => `<button type="button" class="tree-item flat ${c === col ? "on" : ""}" data-act="col-pick" data-col="${esc(c)}"><span class="nm">${esc(c)}</span><span class="n">${Object.keys(data[c] || {}).length}</span></button>`).join("") || `<p class="sub" style="padding:8px 12px; font-size:14px">Vacía por ahora.</p>`}
      <button type="button" class="btn btn-soft btn-sm" style="margin:12px" data-act="doc-new" data-newcol="1">+ Nueva colección</button>
    </aside>
    <main class="main">
      ${note ? `<div class="note">${ICON_INFO}<p>${note}</p></div>` : ""}
      ${col ? `<section class="card">
        <div class="card-head"><h2><span class="mono" style="font-family:var(--mono)">${esc(col)}</span> ${kind(col)}</h2>
          <span style="display:flex; gap:8px; flex-wrap:wrap"><button class="btn btn-soft btn-sm" type="button" data-act="doc-new">+ Nuevo documento</button><button class="btn btn-danger btn-sm" type="button" data-act="col-del">Borrar colección</button></span></div>
        <div class="tbl-box"><table style="min-width:560px"><thead><tr><th>Clave</th><th>Valor</th><th class="r">Acciones</th></tr></thead><tbody>
          ${docs.map(([k, v]) => `<tr><td class="mono" style="white-space:nowrap">${esc(k)}</td><td><code style="color:var(--text-2); font-size:13px">${esc(short(fmtJson(v), 110))}</code></td>
            <td class="r"><button class="btn btn-soft btn-sm" type="button" data-act="doc-edit" data-key="${esc(k)}">Editar</button> <button class="btn btn-danger btn-sm" type="button" data-act="doc-del" data-key="${esc(k)}">Borrar</button></td></tr>`).join("")}
        </tbody></table></div>
        ${docs.length ? "" : `<p class="empty">Esta colección está vacía.</p>`}
      </section>` : `<div class="card card-pad"><h2 style="font-size:20px">Todavía no hay datos</h2><p class="sub">Se crean solos cuando tu juego usa <code>orb_db_set</code> o <code>orb_db_merge</code>, o los puedes crear aquí.</p></div>`}
    </main></div>`;
}

// Editor de objetos del mundo por versión y sala (lo usan el proyecto y el admin)
async function worldPanel(el, { api, spaces, baseOf, selKey }) {
  const sel = (S.sel[selKey] ||= {});
  if (!spaces.some((s) => s.ns === sel.ns)) sel.ns = spaces[0]?.ns;
  if (!sel.ns) {
    el.innerHTML = `<div class="wrap page"><div class="card card-pad"><h2 style="font-size:20px">Todavía no hay objetos del mundo</h2><p class="sub">Aparecen cuando tu juego usa <code>orb_world_create</code> dentro de una sala.</p></div></div>`;
    return;
  }
  const { data: rooms } = await api(baseOf(sel.ns));
  const ids = Object.keys(rooms || {}).sort();
  if (!ids.includes(sel.room)) sel.room = ids[0];
  const objs = sel.room ? rooms[sel.room] || {} : {};
  S.objs = objs;
  S.ctx = { api, worldBase: `${baseOf(sel.ns)}/${encodeURIComponent(sel.room || "")}`, after: () => worldPanel(el, { api, spaces, baseOf, selKey }) };
  el.innerHTML = `<div class="split" style="min-height:auto">
    <aside class="side" aria-label="Salas con objetos">
      <label class="f" style="padding:0 12px 10px">Versión / juego
        <select data-act="ns-pick" data-sel="${esc(selKey)}">${spaces.map((s) => `<option value="${esc(s.ns)}" ${s.ns === sel.ns ? "selected" : ""}>${esc(s.label)}</option>`).join("")}</select>
      </label>
      <div class="tree-title">Salas con objetos</div>
      ${ids.map((id) => `<button type="button" class="tree-item flat ${id === sel.room ? "on" : ""}" data-act="wroom-pick" data-sel="${esc(selKey)}" data-room="${esc(id)}"><span class="nm">${esc(id)}</span><span class="n">${Object.keys(rooms[id]).length}</span></button>`).join("") || `<p class="sub" style="padding:8px 12px; font-size:14px">Ninguna sala tiene objetos.</p>`}
      <button type="button" class="btn btn-soft btn-sm" style="margin:12px" data-act="obj-new" data-askroom="1">+ Objeto en otra sala</button>
    </aside>
    <main class="main">
      ${sel.room ? `<section class="card">
        <div class="card-head"><h2>Sala <span class="mono" style="font-family:var(--mono)">${esc(sel.room)}</span></h2><button class="btn btn-soft btn-sm" type="button" data-act="obj-new">+ Crear objeto</button></div>
        ${Object.entries(objs).map(([id, p]) => `<div class="row">
          <span class="mono" style="color:var(--muted-2); width:52px">#${esc(id)}</span>
          <span style="font-weight:500; min-width:110px">${esc(p.tipo || p.type || p.kind || "objeto")}</span>
          <code class="keybox" style="font-size:13px">${esc(short(fmtJson(p), 140))}</code>
          <span style="display:flex; gap:6px;"><button class="btn btn-soft btn-sm" type="button" data-act="obj-edit" data-id="${esc(id)}">Editar</button><button class="btn btn-danger btn-sm" type="button" data-act="obj-del" data-id="${esc(id)}">Borrar</button></span>
        </div>`).join("") || `<p class="empty">Sin objetos.</p>`}
      </section>` : ""}
    </main></div>`;
}

function tabDatos(P) {
  $("#app").innerHTML = `<div id="dbbox"></div>`;
  return dbPanel($("#dbbox"), {
    api: dev, base: `/api/dev/db/${encodeURIComponent(P.id)}`, selKey: "db:" + P.id,
    note: "Una sola base de datos para todas las versiones de tu juego. Colecciones <code>ro_…</code>: los jugadores solo pueden leerlas (rankings, tiendas). <code>priv_…</code> y <code>_…</code>: solo el servidor.",
  });
}
function tabMundo(P) {
  $("#app").innerHTML = `<div id="wbox"></div>`;
  const spaces = P.channels.map((c) => ({ ns: c.ns, label: "Versión " + c.gameId }));
  return worldPanel($("#wbox"), { api: dev, spaces, baseOf: (ns) => `/api/dev/world/${encodeURIComponent(ns)}`, selKey: "w:" + P.id });
}

// ---------------------------------------------------------------------
// Proyecto · CLAVES Y AJUSTES
// ---------------------------------------------------------------------
function tabClaves(P) {
  S.proj = P;
  const reqs = P.requests || {};
  const svc = (id, t, d) => `<div class="row" style="justify-content:space-between">
      <div style="display:flex; flex-direction:column; gap:4px; flex:1 1 360px;"><span style="font-weight:600">${t}</span><span class="sub" style="font-size:14px">${d}</span></div>
      ${P[id] ? `<span class="status on" style="border:1px solid #1F4A3A; padding:8px 12px; border-radius:999px;"><span class="dot on"></span>Activado</span>`

        : `<button class="btn btn-ghost btn-sm" type="button" data-act="request" data-svc="${id}">Pedir acceso</button>`}

  $("#app").innerHTML = `<div class="wrap page" style="max-width:1100px;">
    <section class="card">
      <div class="card-head">
        <div style="display:flex; flex-direction:column; gap:4px;"><h2 style="font-size:20px">Claves de este proyecto</h2><p class="sub" style="font-size:14.5px">Todas entran al mismo juego. Si una se filtra, la cambias y no pierdes datos.</p></div>
        <button class="btn btn-sm" type="button" data-act="key-new">+ Nueva clave</button>
      </div>
      ${P.keyList.map((k) => `<div class="row">
        <div style="flex:0 0 170px; display:flex; flex-direction:column; gap:4px;">
          <span style="font-weight:600">${esc(k.label)}</span>
          <span class="status ${k.active ? "on" : ""}"><span class="dot ${k.active ? "on" : ""}"></span>${k.active ? `Activa · ${k.onlineNow} en línea` : "Pausada"}</span>
        </div>
        <code class="keybox" data-key-text="${esc(k.uuid)}">${esc(mask(k.uuid))}</code>
        <span style="display:flex; gap:6px; flex-wrap:wrap;">
          <button class="btn btn-soft btn-sm" type="button" data-act="key-show" data-uuid="${esc(k.uuid)}">Mostrar</button>
          <button class="btn btn-soft btn-sm" type="button" data-act="key-copy" data-uuid="${esc(k.uuid)}">Copiar</button>
          <button class="btn btn-soft btn-sm" type="button" data-act="key-rotate" data-uuid="${esc(k.uuid)}" data-label="${esc(k.label)}">Cambiar</button>
          <button class="btn btn-ghost btn-sm" type="button" data-act="key-pause" data-uuid="${esc(k.uuid)}" data-active="${k.active ? 1 : 0}">${k.active ? "Pausar" : "Reanudar"}</button>
          <button class="btn btn-danger btn-sm" type="button" data-act="key-del" data-uuid="${esc(k.uuid)}" data-label="${esc(k.label)}">Borrar</button>
        </span>
      </div>`).join("") || `<p class="empty">Este proyecto no tiene claves. Crea una para que tu juego pueda entrar.</p>`}
    </section>

    <section class="card card-pad">
      <h2 style="font-size:20px">Pégalo en tu juego</h2>
      <p class="sub">En <code>orb_config</code> de GameMaker. Usa la clave de <b>Desarrollo</b> en tu PC y la de <b>Publicado</b> en el juego que subes.</p>
      <div class="code-box"><pre class="code">${connectSnippet("[TU CLAVE]")}</pre></div>
    </section>

    <section class="card">
      <div class="card-head"><h2 style="font-size:20px">Servicios extra</h2></div>
      ${svc("ai", "IA en el servidor", "<code>orb_ai()</code>. La activa el administrador del servidor porque gasta créditos.")}

    <section class="card card-pad">
      <h2 style="font-size:20px">Nombre del proyecto</h2>
      <div class="form-row"><label class="f">Nombre<input type="text" id="proj-name" maxlength="48" value="${esc(P.name)}"></label><button class="btn btn-ghost" type="button" data-act="proj-rename">Guardar</button></div>
      <p class="sub" style="font-size:14px">Id del proyecto: <code>${esc(P.id)}</code></p>

    <section class="card-pad" style="border:1px solid var(--danger-line); border-radius:16px; flex-direction:row; flex-wrap:wrap; justify-content:space-between; align-items:center;">
      <div style="display:flex; flex-direction:column; gap:4px; flex:1 1 420px;"><h2 style="font-size:18px; color:var(--danger)">Borrar proyecto</h2><p class="sub" style="font-size:14.5px">Se borran sus claves, la base de datos y los objetos del mundo, y se desconecta a sus jugadores. No se puede deshacer.</p></div>
      <button class="btn btn-danger" type="button" data-act="proj-del">Borrar ${esc(P.name)}</button>
    </section>
  </div>`;
}
</script>
<script>
// ---------------------------------------------------------------------
// DOCUMENTACIÓN (sacada de orb_api.gml; si cambias el SDK, cambia esto también)
// ---------------------------------------------------------------------
const DOC_CATS = [
  ["rapido", "Primer juego (5 min)"], ["conexion", "Conexión y red"], ["salas", "Salas y partida rápida"],
  ["jugadores", "Jugadores, entidades y eventos"], ["datos", "Base de datos y mundo"], ["servidor", "Servidor, IA y Discord"],
  ["proyectos", "Proyectos, claves y versiones"], ["todo", "Ver todo"],
];
// Clave de ejemplo (ficticia). La real sale en el Dashboard → Claves y ajustes.
const EJ_KEY = "3f9a1c2e-7b4d-4e8a-9c21-5d6e7f8a9b0c";
// La dirección del servidor Órbita es la de esta misma página.
function orbHost() {
  const https = location.protocol === "https:";
  return { host: location.hostname, port: location.port || (https ? "443" : "80"), secure: https };
}
function configCode() {
  const h = orbHost();
  return `#macro ORB_HOST      "${h.host}"
#macro ORB_PORT      ${h.port}
#macro ORB_SECURE    ${h.secure}
#macro ORB_GAME_ID   "1.0"      // versión o modo de tu juego
#macro ORB_GAME_KEY  "${EJ_KEY}"   // ← pon la tuya`;
}

// Cada función: título, qué hace, parámetros, qué devuelve, ejemplo, ideas para usarla y cosas a tener en cuenta.
const DOCS = [
  // ===================== PRIMER JUEGO =====================
  { cat: "rapido", title: "1. Crea tu cuenta y un proyecto",
    desc: "Entra al <b>Dashboard</b>, crea tu cuenta y luego un proyecto (un proyecto = un juego). Cada proyecto trae dos claves: <b>Desarrollo</b> para probar en tu PC y <b>Publicado</b> para el juego que subes.",
    ideas: ["Haz un proyecto por juego. Si tienes 3 juegos, 3 proyectos: sus jugadores nunca se mezclan."] },
  { cat: "rapido", title: "2. Importa Órbita en tu juego",
    desc: "Descarga el SDK. En GameMaker abre el proyecto Órbita → <b>Tools → Create Local Package</b> → marca la carpeta <b>Orbita</b> (scripts y objetos) y guárdalo. En tu juego: <b>Tools → Import Local Package</b>." },
  { cat: "rapido", title: "3. Pega tu clave en orb_config",
    desc: "Abre el script <code>orb_config</code>. La dirección ya apunta al servidor de Órbita; solo cambia la clave por la tuya (Dashboard → tu proyecto → <b>Claves y ajustes</b> → Copiar).",
    codeFn: configCode,
    ojo: ["La clave de arriba es de ejemplo, no funciona. Usa la de tu proyecto.", "<code>ORB_GAME_ID</code> es la versión de tu juego. Cuando saques una actualización que cambie cómo se juega, súbela (\"1.1\") para que no se junten con los de la versión vieja."] },
  { cat: "rapido", title: "4. Conecta y entra a una sala",

orb_join_room("lobby");` },
  { cat: "rapido", title: "5. Comparte lo que los demás ven de ti",
    desc: "En el <b>Step</b> de tu jugador. Con esto los demás ya te ven moverte con tu sprite.",
    code: `global.orb_state = orb_state_from(id);   // x, y, sprite, escala, ángulo, color, alpha
global.orb_state.nombre = "Ana";` },
  { cat: "rapido", title: "6. Dale Run dos veces",
    desc: "Abre el juego dos veces (o crea el ejecutable y ábrelo dos veces). Cada ventana ve a la otra. En el Dashboard, en <b>Salas en vivo</b>, vas a ver la sala <code>lobby</code> con los dos jugadores.",
    ideas: ["Pon <code>orb_debug_draw(10, 10);</code> en un Draw GUI para ver la conexión, tu sala y el ping mientras pruebas."] },

  // ===================== CONEXIÓN =====================
  { cat: "conexion", title: "orb_connect()",
    desc: "Se conecta al servidor de Órbita usando lo que pusiste en <code>orb_config</code>. Crea <code>obj_orb</code> sola (no lo pongas en el room). Si se cae el internet, se reconecta sola.",
    returns: "Nada. Cuando se conecta llega el evento <code>ORB_EV_CONNECTED</code> con <code>{ my_id }</code>.",
    code: `// Create de obj_control
orb_connect();

orb_on(ORB_EV_CONNECTED, function(_d, _from) {
    estado = "En línea";
    show_debug_message("Mi id es " + string(_d.my_id));
});
orb_on(ORB_EV_DISCONNECTED, function(_d, _from) {
    estado = "Reconectando…";
});`,
    ideas: ["Llámala en el primer room del juego (pantalla de título) para que cuando el jugador llegue al menú ya esté conectado.", "Muestra un ícono de \"en línea / sin conexión\" en tu HUD usando <code>orb_is_connected()</code>.", "Si tu juego también tiene modo un jugador, no la llames hasta que elijan \"Jugar en línea\"."],
    ojo: ["Llámala una sola vez. Si la llamas otra vez estando conectado no pasa nada."] },
  { cat: "conexion", title: "orb_disconnect()",
    desc: "Se desconecta y <b>no</b> vuelve a intentar. Sale de la sala en la que estabas.",
    code: `// Botón "Volver al menú principal"
orb_disconnect();
room_goto(rm_menu);`,
    ideas: ["Úsala al volver a un modo un jugador o al cerrar sesión.", "Para volver a conectarte después, llama <code>orb_connect()</code> otra vez."] },
  { cat: "conexion", title: "orb_is_connected() · orb_status()",
    desc: "<code>orb_is_connected()</code> devuelve <code>true</code> si estás conectado. <code>orb_status()</code> devuelve el texto <code>\"off\"</code>, <code>\"connecting\"</code> o <code>\"connected\"</code>.",
    code: `// Draw GUI: luz de conexión
var _c = c_red;
if (orb_status() == "connecting") _c = c_yellow;
if (orb_is_connected()) _c = c_lime;
draw_circle_colour(20, 20, 6, _c, _c, false);`,
    ideas: ["Desactiva el botón \"Buscar partida\" mientras <code>orb_is_connected()</code> sea false.", "Muestra \"Conectando…\" con un spinner mientras el estado sea \"connecting\"."] },
  { cat: "conexion", title: "orb_my_id() · orb_ping()",
    desc: "<code>orb_my_id()</code> es tu número de jugador en esta conexión (-1 si no estás conectado). <code>orb_ping()</code> es tu ping en milisegundos (-1 si todavía no se sabe).",
    code: `draw_text(10, 10, "Ping: " + string(orb_ping()) + " ms");
if (orb_ping() > 200) draw_text(10, 30, "Conexión lenta");`,
    ideas: ["Pinta el ping de verde, amarillo o rojo según qué tan alto esté.", "Usa <code>orb_my_id()</code> para saber si un evento que llegó es tuyo (<code>_from == orb_my_id()</code>)."],
    ojo: ["El id cambia cada vez que te conectas: no lo uses para guardar progreso. Para eso usa un nombre o código del jugador como clave en la base de datos."] },
  { cat: "conexion", title: "orb_debug_draw(x, y)",
    desc: "Dibuja el estado de la conexión, el servidor, tu id, el ping, la sala, tu puesto y cuántos jugadores hay. Úsalo en un evento <b>Draw GUI</b> mientras desarrollas.",
    code: `// Draw GUI de obj_control
if (debug_mode) orb_debug_draw(10, 10);`,
    ideas: ["Actívalo con una tecla (F1) para tenerlo a mano en las pruebas sin que lo vean los jugadores."] },
  { cat: "conexion", title: "ORB_EV_ERROR: cuando algo sale mal",
    desc: "Llega cuando el servidor rechaza algo. <code>data</code> trae <code>{ code, msg }</code>.",
    params: [["bad_key", "La clave no existe, está pausada o la cambiaste en el Dashboard. Copia la clave nueva."], ["bad_protocol", "Tu SDK es más viejo que el servidor. Descarga el SDK otra vez."], ["rate_limited", "Mandaste demasiados mensajes en un segundo. Revisa que no mandes eventos en cada Step."], ["too_many_connections", "Demasiadas conexiones desde la misma red."]],
    code: `orb_on(ORB_EV_ERROR, function(_e, _from) {

  // ===================== SALAS =====================
  { cat: "salas", title: "orb_join_room(sala, [max], [callback])",
    desc: "Entra a una sala. Si no existe, se crea y tú quedas de host. Si no estás conectado todavía, entra sola apenas se conecte.",
    params: [["sala", "Nombre de la sala (texto, hasta 64 letras)."], ["max", "Máximo de jugadores. 0 = sin límite. Solo cuenta al crear la sala."], ["callback", "Opcional: <code>function(ok, sala_o_error)</code>. Error posible: <code>\"room_full\"</code>."]],
    returns: "Nada. Al entrar llega <code>ORB_EV_ROOM</code> con <code>{ name, host, slot }</code>.",
    code: `// Sala privada con código de 4 letras
codigo = "K7QZ";
orb_join_room("priv_" + codigo, 4, function(_ok, _r) {
    if (_ok) room_goto(rm_lobby);
    else if (_r == "room_full") mensaje = "La sala está llena";
});`,
    ideas: ["<b>Salas con código</b>: genera un código al azar y compártelo para que tus amigos entren con <code>orb_join_room(\"priv_\" + codigo)</code>.", "<b>Un lobby general</b> donde todos se ven antes de jugar: <code>orb_join_room(\"lobby\")</code>.", "<b>Mundo por zonas</b>: una sala por mapa (<code>\"bosque\"</code>, <code>\"cueva\"</code>) y cambias de sala al cambiar de room.", "<b>Salas por idioma o región</b>: <code>\"lobby_es\"</code>, <code>\"lobby_en\"</code>."],
    ojo: ["Solo estás en una sala a la vez: entrar a otra te saca de la anterior.", "El nombre de la sala lo ve cualquiera con <code>orb_list_rooms</code>; para algo privado usa códigos difíciles de adivinar."] },
  { cat: "salas", title: "orb_leave_room([callback])",
    desc: "Sale de la sala actual. También cancela la búsqueda de partida si estabas buscando.",
    code: `// Botón "Salir de la partida"
orb_leave_room(function(_ok, _r) {
    room_goto(rm_menu);
});`,
    ideas: ["Úsala al volver al menú. Los demás reciben <code>ORB_EV_LEFT</code> y tu personaje desaparece de sus pantallas."] },
  { cat: "salas", title: "orb_room() · orb_slot()",
    desc: "<code>orb_room()</code> es el nombre de tu sala (\"\" si no estás en una). <code>orb_slot()</code> es tu puesto en la sala: 0, 1, 2… (el primer hueco libre, así que si alguien se va, el siguiente que entre toma su puesto).",
    code: `// Equipos automáticos: pares rojo, impares azul
equipo = orb_slot() mod 2;
x = (equipo == 0) ? 100 : room_width - 100;

// Colores por puesto
var _colores = [c_red, c_blue, c_lime, c_yellow];
image_blend = _colores[orb_slot() mod 4];`,
    ideas: ["<b>Equipos</b>: <code>orb_slot() mod 2</code>.", "<b>Punto de aparición</b> distinto para cada jugador según su puesto.", "<b>Turnos</b> en juegos de mesa o cartas: le toca al puesto <code>turno mod jugadores</code>."] },
  { cat: "salas", title: "orb_is_host() · orb_host_id()",
    desc: "El host es el jugador que lleva más tiempo en la sala. Si se va, el siguiente pasa a ser host y llega <code>ORB_EV_HOST</code> con <code>{ player }</code>.",
    code: `// Solo el host crea las banderas, así no salen duplicadas
if (orb_is_host()) {
    orb_world_create({ tipo: "bandera", equipo: 0, x: 100, y: 300 });
    orb_world_create({ tipo: "bandera", equipo: 1, x: 1180, y: 300 });
}
orb_on(ORB_EV_HOST, function(_d, _from) {
    if (_d.player == orb_my_id()) mensaje = "Ahora eres el host";
});`,
    ideas: ["El host decide cuándo empieza la partida (botón \"Empezar\" solo para él).", "El host maneja a los enemigos (IA) y manda sus posiciones; los demás solo los dibujan.", "El host elige el mapa o el modo de juego."],
    ojo: ["El host puede hacer trampa porque corre en su PC. Para cosas que importan (puntos, premios) usa la lógica del servidor."] },
  { cat: "salas", title: "orb_kick(jugador)",
    desc: "Saca a un jugador de tu sala. Solo funciona si eres el host. Al expulsado le llega <code>ORB_EV_KICKED</code> con <code>{ by }</code>.",
    code: `// En la lista del lobby, botón "Expulsar" junto a cada jugador
if (orb_is_host()) orb_kick(jugador_id);

// En el expulsado:
orb_on(ORB_EV_KICKED, function(_d, _from) {
    show_message("Te sacaron de la sala");
    room_goto(rm_menu);
});`,
    ideas: ["Sacar a alguien que no está listo o que molesta en el lobby."] },
  { cat: "salas", title: "orb_list_rooms(callback) · orb_room_players(sala, callback)",
    desc: "<code>orb_list_rooms</code> te da las salas abiertas de tu versión: <code>[{ id, players, max }]</code>. <code>orb_room_players</code> te da los ids de los jugadores de una sala.",
    code: `// Buscador de salas
orb_list_rooms(function(_ok, _lista) {
    if (!_ok) exit;
    salas = [];
    for (var i = 0; i < array_length(_lista); i++) {
        var _s = _lista[i];
        if (_s.max == 0 || _s.players < _s.max) array_push(salas, _s);  // solo las que tienen espacio
    }
});`,
    ideas: ["<b>Navegador de salas</b>: dibuja la lista y al hacer clic entra con <code>orb_join_room(sala.id)</code>.", "Muestra \"3/4\" en cada sala con <code>players</code> y <code>max</code>.", "Esconde las salas que empiezan con <code>\"priv_\"</code> para que solo se entre con código."] },
  { cat: "salas", title: "orb_matchmake(tamaño, [modo], [callback])",
    desc: "Partida rápida: te pone en una cola con los que buscan lo mismo. Cuando hay <code>tamaño</code> jugadores, entran todos juntos a una sala nueva (<code>match_&lt;modo&gt;_&lt;número&gt;</code>). Mientras esperas llega <code>ORB_EV_QUEUE</code> con <code>{ count, size }</code>.",
    params: [["tamaño", "Cuántos jugadores por partida (1 a 64)."], ["modo", "Opcional. Solo se juntan los que buscan el mismo modo: <code>\"ctf\"</code>, <code>\"duelo\"</code>, <code>\"2v2\"</code>…"]],
    code: `// Botón "Partida rápida 1 vs 1"
orb_matchmake(2, "duelo");

orb_on(ORB_EV_QUEUE, function(_q, _from) {
    texto = "Buscando rival… " + string(_q.count) + "/" + string(_q.size);
});
orb_on(ORB_EV_ROOM, function(_r, _from) {
    if (string_pos("match_", _r.name) == 1) room_goto(rm_partida);
});`,
    ideas: ["Un botón por modo: \"1v1\" (2, \"duelo\"), \"Todos contra todos\" (4, \"ffa\"), \"Equipos\" (4, \"2v2\").", "Pon un botón \"Cancelar\" con <code>orb_matchmake_cancel()</code>.", "Si tarda mucho, ofrece jugar contra la computadora mientras tanto."],
    ojo: ["Solo se juntan jugadores de la misma versión (<code>ORB_GAME_ID</code>)."] },
  { cat: "salas", title: "orb_matchmake_cancel() · orb_in_queue() · orb_queue_count()",
    desc: "Cancela la búsqueda, te dice si sigues buscando y cuántos van en tu cola.",
    code: `// Draw GUI mientras busca
if (orb_in_queue()) {
    draw_text(400, 300, "Buscando… " + string(orb_queue_count()));
    if (keyboard_check_pressed(vk_escape)) orb_matchmake_cancel();
}` },

  // ===================== JUGADORES =====================
  { cat: "jugadores", title: "global.orb_state y orb_state_from(instancia)",
    desc: "<code>global.orb_state</code> es lo que los demás ven de ti. Órbita lo manda sola cada pocos frames (<code>ORB_SEND_EVERY</code>), y solo si cambió. <code>orb_state_from</code> copia de una instancia las variables de <code>ORB_DEFAULT_SYNC</code> (x, y, sprite, frame, escala, ángulo, color, alpha, visible).",
    code: `// Step de obj_jugador
global.orb_state = orb_state_from(id);
global.orb_state.nombre = nombre;
global.orb_state.vida   = vida;
global.orb_state.arma   = arma_actual;

// En el objeto de los demás (hijo de obj_orb_player), Draw:
draw_self();
draw_text(x, y - 40, orb_state.nombre);
draw_healthbar(x - 20, y - 30, x + 20, y - 26, orb_state.vida, c_black, c_red, c_lime, 0, true, false);`,
    ideas: ["Nombre y barra de vida sobre cada jugador.", "La animación: si mandas <code>sprite_index</code> e <code>image_index</code>, los demás ven correr, saltar o atacar.", "Un \"emote\" o estado (<code>listo: true</code>) para mostrar quién está listo en el lobby."],
    ojo: ["Manda solo lo que los demás necesitan ver. Cosas muy grandes (arrays largos) gastan red en cada envío.", "No uses nombres de variables de GameMaker como campos (<code>room</code>, <code>health</code>, <code>score</code>, <code>id</code>)."] },
  { cat: "jugadores", title: "Otros jugadores: orb_players() y compañía",
    desc: "Funciones para leer a los demás de tu sala.",
    params: [["orb_players()", "Array con los ids de los demás (sin ti)."], ["orb_player_count()", "Cuántos otros hay (sin ti)."], ["orb_player_instance(id)", "La instancia que lo representa (<code>noone</code> si no existe)."], ["orb_player_state(id)", "Su <code>global.orb_state</code>."], ["orb_player_slot(id)", "Su puesto (-1 si no está)."], ["orb_player_data(id)", "Datos que el servidor le puso (ver lógica del servidor)."]],
    code: `// Tabla de puntos en el Draw GUI
var _ids = orb_players();
draw_text(20, 20, nombre + ": " + string(puntos));
for (var i = 0; i < array_length(_ids); i++) {
    var _s = orb_player_state(_ids[i]);
    draw_text(20, 40 + i * 20, string(_s[$ "nombre"] ?? "?") + ": " + string(_s[$ "puntos"] ?? 0));
}`,
    ideas: ["<b>Marcador</b> con nombres y puntos.", "<b>Flecha en el borde de la pantalla</b> apuntando a cada compañero fuera de la vista (con <code>orb_player_instance</code>).", "Empezar la partida solo cuando <code>orb_player_count() + 1</code> llegue al número que quieres."],
    ojo: ["Usa <code>_s[$ \"campo\"] ?? valor</code> por si ese jugador todavía no mandó ese dato."] },
  { cat: "jugadores", title: "Tu propio objeto para los demás jugadores",
    desc: "Por defecto los demás aparecen como <code>ORB_PLAYER_OBJECT</code>. Para usar el tuyo, crea un objeto hijo de <code>obj_orb_player</code> y pon su nombre en <code>ORB_PLAYER_OBJECT</code> en <code>orb_config</code>. En sus eventos llama <code>event_inherited()</code>. Adentro tienes <code>orb_id</code>, <code>orb_slot</code>, <code>orb_state</code> y <code>orb_data</code>.",
    code: `// orb_config
#macro ORB_PLAYER_OBJECT  obj_otro_jugador

// obj_otro_jugador → Draw
event_inherited();                       // se dibuja con su sprite
draw_set_halign(fa_center);
draw_text(x, y - 36, orb_state[$ "nombre"] ?? "");`,
    ideas: ["Ponle colisiones para que tus balas puedan pegarle (y avisa con un evento a quién le pegaste).", "Dibuja un contorno del color de su equipo con <code>orb_slot mod 2</code>."] },
  { cat: "jugadores", title: "orb_spawn_views(activado)",
    desc: "Con <code>false</code> Órbita deja de crear (y borra) las instancias de los demás jugadores y sus entidades. Con <code>true</code> las vuelve a crear.",
    code: `// En el room del menú
orb_spawn_views(false);
// Al entrar a la partida
orb_spawn_views(true);`,
    ideas: ["En el menú o el lobby, donde no quieres personajes caminando por la pantalla.", "En una pantalla de carga."] },
  { cat: "jugadores", title: "Entidades: obj_orb_entity",
    desc: "Para balas, cajas, efectos o cualquier cosa que creas tú y los demás deben ver: pon <code>obj_orb_entity</code> como <b>padre</b> de tu objeto. Aparece sola en los demás como <code>ORB_ENTITY_OBJECT</code> (con <code>orb_props</code>, <code>orb_owner</code> y <code>orb_kind</code>) y desaparece cuando la destruyes.",
    code: `// obj_bala (padre: obj_orb_entity) → Create
event_inherited();
orb_sync  = ["x", "y", "image_angle"];   // qué copiar (por defecto: ORB_DEFAULT_SYNC)
orb_props = { dano: 10, equipo: equipo };  // datos extra que los demás leen

speed = 12;`,
    ideas: ["<b>Balas y proyectiles</b> que los demás ven volar.", "<b>Trampas o bombas</b> que pone un jugador.", "<b>Efectos</b> (humo, explosiones) que deben verse en todas las pantallas."],
    ojo: ["Cada jugador puede tener hasta 512 entidades a la vez.", "Para cosas que deben quedarse aunque el jugador se vaya (cofres, construcciones), usa <b>objetos del mundo</b>, no entidades."] },
  { cat: "jugadores", title: "orb_entity_view(nombre_objeto, objeto_vista)",
    desc: "Elige con qué objeto se dibuja en los demás una entidad de cierto tipo. Si no lo dices, se usa <code>ORB_ENTITY_OBJECT</code>.",
    code: `// Create de obj_control (una sola vez)
orb_entity_view("obj_bala", obj_bala_remota);
orb_entity_view("obj_bomba", obj_bomba_remota);`,
    ideas: ["La bala remota puede tener solo el dibujo, sin lógica de daño (el daño lo decide quien disparó o el servidor)."] },
  { cat: "jugadores", title: "orb_on(nombre, función) · orb_off(nombre)",
    desc: "<code>orb_on</code> escucha un evento: la función recibe <code>(data, from)</code>, donde <code>from</code> es el id de quien lo mandó (-1 = el servidor o el sistema). <code>orb_off</code> deja de escuchar ese evento.",
    code: `// Create de obj_control
orb_on("chat", function(_d, _from) {
    array_push(mensajes, _d.nombre + ": " + _d.txt);
});
orb_on(ORB_EV_JOINED, function(_d, _from) {
    array_push(mensajes, "Entró un jugador (puesto " + string(_d.slot) + ")");
});`,
    ideas: ["Un <code>orb_on</code> por cada cosa que pasa en tu juego: \"disparo\", \"golpe\", \"chat\", \"bandera_tomada\"…", "Escucha <code>ORB_EV_LEFT</code> para mostrar \"X salió de la partida\"."],
    ojo: ["Si la misma instancia llama <code>orb_on</code> dos veces con el mismo nombre, se reemplaza (no se duplica).", "Si la instancia se destruye, sus <code>orb_on</code> se borran solos.", "Adentro de la función, guarda los datos en variables de la instancia (no en <code>var</code> de afuera)."] },
  { cat: "jugadores", title: "orb_send_room(nombre, datos) · orb_send_all(nombre, datos)",
    desc: "Mandan un evento a tu sala. <code>orb_send_room</code> a todos menos a ti; <code>orb_send_all</code> a todos incluido tú.",
    code: `// Disparo: los demás crean el efecto
orb_send_room("disparo", { x: x, y: y, dir: image_angle });

// Chat: que te llegue también a ti para usar el mismo código de dibujo
orb_send_all("chat", { nombre: nombre, txt: texto });`,
    ideas: ["<b>Chat</b> de la sala.", "<b>Sonidos y efectos</b>: \"explosión en x, y\" para que todos la escuchen.", "<b>Avisos de juego</b>: \"bandera_tomada\", \"ronda_terminada\", \"empezar\".", "Usa <code>orb_send_all</code> cuando quieres que tu juego reaccione igual que el de los demás."],
    ojo: ["No mandes eventos en cada Step: para cosas continuas (posición) usa <code>global.orb_state</code>. Si mandas más de 240 mensajes por segundo te llega <code>rate_limited</code>."] },
  { cat: "jugadores", title: "orb_send(jugador, nombre, datos)",
    desc: "Manda un evento a un solo jugador de tu misma sala.",
    code: `// Le pegaste a alguien: avísale solo a él
var _otro = instance_place(x, y, obj_otro_jugador);
if (_otro != noone) {
    orb_send(_otro.orb_id, "golpe", { dano: 15, de: orb_my_id() });
    instance_destroy();
}
// En todos:
orb_on("golpe", function(_d, _from) { vida -= _d.dano; });`,
    ideas: ["<b>Mensajes privados</b> en el chat.", "<b>Daño</b>: avisarle a quien le pegaste.", "<b>Intercambio</b>: \"te ofrezco esta carta\"."],
    ojo: ["Solo llega si el otro está en tu misma sala."] },
  { cat: "jugadores", title: "Eventos del sistema",
    desc: "Llegan solos; escúchalos con <code>orb_on</code>.",
    params: [["ORB_EV_CONNECTED", "<code>{ my_id }</code> — te conectaste."], ["ORB_EV_DISCONNECTED", "<code>{ reason }</code> — se cortó (se reintenta sola)."], ["ORB_EV_ROOM", "<code>{ name, host, slot }</code> — entraste a una sala (<code>name</code> = \"\" si saliste)."], ["ORB_EV_JOINED", "<code>{ player, slot }</code> — alguien entró a tu sala."], ["ORB_EV_LEFT", "<code>{ player }</code> — alguien salió."], ["ORB_EV_HOST", "<code>{ player }</code> — cambió el host."], ["ORB_EV_QUEUE", "<code>{ count, size }</code> — cómo va la búsqueda de partida."], ["ORB_EV_PLAYER_DATA", "<code>{ player }</code> — el servidor cambió los datos de un jugador."], ["ORB_EV_KICKED", "<code>{ by }</code> — te expulsaron."], ["ORB_EV_DISCORD", "<code>{ channel, user, user_id, msg }</code> — mensaje de Discord."], ["ORB_EV_ERROR", "<code>{ code, msg }</code> — algo salió mal."]] },

  // ===================== DATOS =====================
  { cat: "datos", title: "orb_db_set(colección, clave, valor, [callback])",
    desc: "Guarda un valor en la base de datos de tu proyecto (reemplaza lo que había). El valor puede ser número, texto, array o struct.",
    params: [["colección", "Como una carpeta: <code>\"perfiles\"</code>, <code>\"partidas\"</code>…"], ["clave", "Como el nombre del archivo: el nombre del jugador, un código…"], ["callback", "Opcional: <code>function(ok, error)</code>."]],
    code: `// Guardar el perfil al terminar la partida
orb_db_set("perfiles", nombre, {
    nivel: nivel,
    oro: oro,
    skin: skin_actual,
    ultima_vez: date_current_datetime()
});`,
    ideas: ["<b>Guardado en la nube</b>: el progreso sigue aunque cambie de PC.", "<b>Configuración del jugador</b> (controles, volumen) para que la tenga en cualquier dispositivo.", "<b>Mensaje del día</b> o noticias que cambias desde el Dashboard sin actualizar el juego."],
    ojo: ["Hasta 64 KB por valor y 10 000 claves por colección.", "Cualquier jugador puede escribir en colecciones normales. Para cosas que no deben trucarse, mira <b>Colecciones protegidas</b>."] },
  { cat: "datos", title: "orb_db_get(colección, clave, callback)",
    desc: "Lee un valor. El callback recibe <code>(ok, valor)</code>. Si no existe: <code>ok = false</code> y valor = <code>\"not_found\"</code>.",
    code: `// Cargar el perfil al entrar (o crearlo si es nuevo)
orb_db_get("perfiles", nombre, function(_ok, _v) {
    if (_ok) {
        nivel = _v.nivel;
        oro   = _v.oro;
    } else if (_v == "not_found") {
        nivel = 1; oro = 0;
        orb_db_set("perfiles", nombre, { nivel: 1, oro: 0 });
    }
});`,
    ideas: ["Cargar el progreso al iniciar.", "Leer la configuración del juego (precios, eventos) desde una colección <code>ro_config</code> que editas en el Dashboard."],
    ojo: ["La respuesta tarda unos milisegundos: no uses el valor en la línea de abajo, úsalo dentro del callback."] },
  { cat: "datos", title: "orb_db_merge(colección, clave, struct, [callback])",
    desc: "Cambia solo algunos campos de un struct guardado, sin borrar los demás. Si no existe, lo crea. El callback recibe <code>(ok, struct_completo)</code>.",
    code: `// Ganó una partida: sumar sin tocar lo demás

function docBlock(d) {
  const code = d.codeFn ? d.codeFn() : d.code;
  return `<article class="fn">
    <h3>${esc(d.title)}</h3>
    <p>${d.desc}</p>
    ${d.params ? `<div class="params">${d.params.map(([k, v]) => `<div class="prm"><code>${esc(k)}</code><span>${v}</span></div>`).join("")}</div>` : ""}
    ${d.returns ? `<p><b style="color:var(--text)">Devuelve:</b> ${d.returns}</p>` : ""}
    ${code ? `<div class="code-box"><pre class="code">${esc(code)}</pre><button class="btn btn-soft btn-sm" type="button" data-act="copy-code" data-i="${DOCS.indexOf(d)}">Copiar</button></div>` : ""}
    ${d.ideas ? `<div class="ideas"><b>Ideas para usarla</b><ul>${d.ideas.map((x) => `<li>${x}</li>`).join("")}</ul></div>` : ""}
    ${d.ojo ? `<div class="ojo"><b>Ojo</b><ul>${d.ojo.map((x) => `<li>${x}</li>`).join("")}</ul></div>` : ""}
  </article>`;
}

function renderDocs(cat) {
  topPublic("docs");
  const q = (S.docQ || "").toLowerCase();
  const items = DOCS.filter((d) => {
    if (q) return (d.title + d.desc + JSON.stringify(d.params || "") + (d.ideas || []).join(" ") + (d.ojo || []).join(" ") + (d.code || "")).toLowerCase().includes(q);
    return cat === "todo" || d.cat === cat;
  });
  const catName = (DOC_CATS.find((c) => c[0] === cat) || DOC_CATS[0])[1];
  const idx = DOC_CATS.findIndex((c) => c[0] === cat);
  const next = idx >= 0 && idx < DOC_CATS.length - 2 ? DOC_CATS[idx + 1] : null;
  $("#app").innerHTML = `<div class="split">
    <nav class="side" aria-label="Temas">
      <label class="f" style="padding:0 6px 12px"><span style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)">Buscar</span>
        <input type="search" id="doc-q" placeholder="Buscar función o tema…" value="${esc(S.docQ || "")}"></label>
      ${DOC_CATS.map(([id, t], i) => `<a class="doc-cat ${id === cat && !q ? "on" : ""}" href="#/docs/${id}" ${id === cat ? 'aria-current="page"' : ""}><span class="n">${i < DOC_CATS.length - 1 ? i + 1 : "·"}</span>${esc(t)}</a>`).join("")}
    </nav>
    <main class="main docs-main" style="padding-left:48px">
      <div style="display:flex; flex-direction:column; gap:10px;">
        <span class="mono" style="font-size:14px; color:var(--accent)">${q ? "Búsqueda" : esc((idx + 1 < DOC_CATS.length ? idx + 1 + " · " : "") + catName)}</span>
        <h1 style="font-size:38px; letter-spacing:-.6px">${q ? `Resultados para «${esc(S.docQ)}»` : cat === "rapido" ? "Tu primer juego online en 5 minutos" : esc(catName)}</h1>
      </div>
      <div>
      ${items.map(docBlock).join("") || `<p class="empty">No encontré nada con eso.</p>`}
      </div>
      ${next && !q ? `<div style="display:flex; justify-content:flex-end"><a class="btn btn-ghost" href="#/docs/${next[0]}">Siguiente: ${esc(next[1])} →</a></div>` : ""}
    </main></div>`;
  const input = $("#doc-q");
  input.oninput = () => { S.docQ = input.value; const pos = input.selectionStart; renderDocs(cat); const i2 = $("#doc-q"); i2.focus(); i2.setSelectionRange(pos, pos); };
}

function fmtUptime(sec) {
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
  return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`;
}
async function renderAdmin(tab) {
