        <td style="font-weight:500">${esc(k.projectName)}</td><td>${esc(k.label || "—")}</td><td style="color:var(--nav)">${esc(k.owner)}</td>
        <td class="mono" style="font-size:13px; color:var(--nav)">${esc(k.uuid.slice(0, 13))}…</td><td>${k.onlineNow}</td>
        <td><button type="button" class="switch" role="switch" aria-checked="${k.active ? "true" : "false"}" aria-label="Activa: ${esc(k.projectName)} ${esc(k.label)}" data-act="adm-key-toggle" data-uuid="${esc(k.uuid)}" data-on="${k.active ? 1 : 0}"></button></td>
        <td class="r"><button class="btn btn-soft btn-sm" type="button" data-act="key-copy" data-uuid="${esc(k.uuid)}">Copiar</button> <button class="btn btn-danger btn-sm" type="button" data-act="adm-key-del" data-uuid="${esc(k.uuid)}">Borrar</button></td>
      </tr>`).join("")}</tbody></table></div>
      ${keys.length ? "" : `<p class="empty">No hay claves.</p>`}
    </section></div>`;
}

async function adminSpaces(kind) {
  const [ov, pr] = await Promise.all([adm("/api/admin/overview"), adm("/api/admin/projects")]);
  S.pnames = Object.fromEntries(pr.projects.map((p) => [p.id, p.name]));
  const ids = new Set(kind === "db" ? [...ov.knownDbGames, ...pr.projects.map((p) => p.id)] : [...ov.knownWorldGames, ...Object.keys(ov.games)]);
  return [...ids].sort().map((ns) => {
    const pid = (ns.match(/^((?:k_[0-9a-f]{8})|(?:p_[0-9a-f]{10}))/) || [])[1];
    return { ns, label: pid && S.pnames[pid] ? `${S.pnames[pid]}${ns.length > pid.length ? " · " + ns.slice(pid.length + 1) : ""}` : ns };
  });
}
async function adminDb() {
  const spaces = await adminSpaces("db");
  const sel = (S.sel["adb"] ||= spaces[0]?.ns || "");
  $("#app").innerHTML = `<div class="wrap" style="padding-top:24px; display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end">
      <label class="f" style="flex:1 1 320px">Juego o proyecto<select data-act="adb-pick">${spaces.map((s) => `<option value="${esc(s.ns)}" ${s.ns === sel ? "selected" : ""}>${esc(s.label)}</option>`).join("")}</select></label>
      ${sel && !/^(k_[0-9a-f]{8}|p_[0-9a-f]{10})/.test(sel) ? `<button class="btn btn-danger" type="button" data-act="adm-game-del" data-ns="${esc(sel)}">Borrar este juego</button>` : ""}
    </div><div id="dbbox"></div>`;
  if (!sel) { $("#dbbox").innerHTML = `<div class="wrap page"><p class="empty">No hay bases de datos todavía.</p></div>`; return; }
  return dbPanel($("#dbbox"), { api: adm, base: `/api/admin/db/${encodeURIComponent(sel)}`, selKey: "adbcol:" + sel });
}
async function adminWorld() {
  const spaces = await adminSpaces("world");
  $("#app").innerHTML = `<div id="wbox"></div>`;
  return worldPanel($("#wbox"), { api: adm, spaces, baseOf: (ns) => `/api/admin/world/${encodeURIComponent(ns)}`, selKey: "aw" });
}

// ---------------------------------------------------------------------
// Botones (todos usan data-act)
// ---------------------------------------------------------------------
const ACTIONS = {
  login: () => openAuth("login"),
  register: () => openAuth("register"),
  logout: logoutDev,
  "admin-out": () => { saveAdmin(""); location.hash = "#/"; },
  refresh: () => render(),
  "copy-code": (d) => { const x = DOCS[Number(d.i)]; copy(x.codeFn ? x.codeFn() : x.code, "Código copiado"); },

  async "new-project"() {
    const name = await ask({ title: "Nuevo proyecto", text: "Un proyecto es un juego. Se crea con una clave de <b>Desarrollo</b> y otra de <b>Publicado</b>.", label: "Nombre del juego", placeholder: "Ej. Capture The Flag", confirm: "Crear proyecto" });
    if (!name) return;
    const { project } = await dev("/api/dev/projects", { method: "POST", body: { name } });
    toast("Proyecto creado");
    location.hash = `#/proyecto/${project.id}/claves`;
  },
  "pick-room"(d) { const pid = route().a; S.sel[pid] = { ns: d.ns, room: d.room }; render(); },
  async kick(d) {
    if (!(await ask({ title: "Expulsar jugador", text: `¿Sacar al jugador <b>#${esc(d.id)}</b> y cerrar su conexión?`, confirm: "Expulsar", danger: true }))) return;
    await S.ctx.api(S.ctx.kickPath, { method: "POST", body: { playerId: Number(d.id) } });
    toast("Jugador expulsado");
    S.ctx.after();
  },
  async "obj-new"(d) {
    let base = S.ctx.worldBase;
    if (d.askroom || base.endsWith("/")) {
      const room = await ask({ title: "Objeto en otra sala", label: "Nombre de la sala", placeholder: "lobby", confirm: "Seguir" });
      if (!room) return;
      base = base.replace(/\/[^/]*$/, "/" + encodeURIComponent(room));
    }
    editJson({ title: "Nuevo objeto del mundo", value: { tipo: "cofre", x: 0, y: 0 }, onSave: async (_k, v) => {
      await S.ctx.api(base, { method: "POST", body: { props: v } });
      toast("Objeto creado"); S.ctx.after();
    } });
  },
  "obj-edit"(d) {
    editJson({ title: `Objeto #${d.id}`, value: S.objs[d.id], onSave: async (_k, v) => {
      await S.ctx.api(`${S.ctx.worldBase}/${encodeURIComponent(d.id)}`, { method: "PUT", body: { props: v } });
      toast("Guardado"); S.ctx.after();
    } });
  },
  async "obj-del"(d) {
    if (!(await ask({ title: "Borrar objeto", text: `¿Borrar el objeto <b>#${esc(d.id)}</b>? Desaparece para todos los de la sala.`, confirm: "Borrar", danger: true }))) return;
    await S.ctx.api(`${S.ctx.worldBase}/${encodeURIComponent(d.id)}`, { method: "DELETE" });
    toast("Objeto borrado"); S.ctx.after();
  },

  // Base de datos
  "col-pick"(d) { S.sel[S.db.selKey] = d.col; S.db.reload(); },
  async "doc-new"(d) {
    let col = S.db.col;
    if (d.newcol || !col) {
      col = await ask({ title: "Nueva colección", text: "Empieza con <code>ro_</code> si los jugadores solo deben leerla, o con <code>priv_</code> si es solo del servidor.", label: "Nombre de la colección", placeholder: "perfiles", confirm: "Seguir" });
      if (!col) return;
    }
    editJson({ title: `Nuevo documento en ${col}`, key: "", keyEditable: true, value: {}, onSave: async (k, v) => {
      await S.db.api(`${S.db.base}/${encodeURIComponent(col)}/${encodeURIComponent(k)}`, { method: "PUT", body: { value: v } });
      toast("Guardado"); S.sel[S.db.selKey] = col; S.db.reload();
    } });
  },
  "doc-edit"(d) {
    const col = S.db.col;
    editJson({ title: `${col} / ${d.key}`, key: d.key, value: S.db.data[col][d.key], onSave: async (_k, v) => {
      await S.db.api(`${S.db.base}/${encodeURIComponent(col)}/${encodeURIComponent(d.key)}`, { method: "PUT", body: { value: v } });
      toast("Guardado"); S.db.reload();
    } });
  },
  async "doc-del"(d) {
    if (!(await ask({ title: "Borrar documento", text: `¿Borrar <b>${esc(d.key)}</b> de <b>${esc(S.db.col)}</b>?`, confirm: "Borrar", danger: true }))) return;
    await S.db.api(`${S.db.base}/${encodeURIComponent(S.db.col)}/${encodeURIComponent(d.key)}`, { method: "DELETE" });
    toast("Borrado"); S.db.reload();
  },
  async "col-del"() {
    const col = S.db.col;
    if (!(await ask({ title: "Borrar colección", text: `Se borran <b>todos</b> los documentos de <b>${esc(col)}</b>.`, mustType: col, confirm: "Borrar colección", danger: true }))) return;
    await S.db.api(`${S.db.base}/${encodeURIComponent(col)}`, { method: "DELETE" });
    toast("Colección borrada"); S.db.reload();
  },

  // Claves y ajustes del proyecto
  "key-show"(d, btn) {
    const box = document.querySelector(`[data-key-text="${CSS.escape(d.uuid)}"]`);
    const show = btn.textContent === "Mostrar";
    box.textContent = show ? d.uuid : mask(d.uuid);
    btn.textContent = show ? "Ocultar" : "Mostrar";
  },
  "key-copy": (d) => copy(d.uuid, "Clave copiada"),
  async "key-new"() {
    const label = await ask({ title: "Nueva clave", label: "¿Para qué es?", placeholder: "Ej. Beta testers", confirm: "Crear clave" });
    if (!label) return;
    await dev(`/api/dev/projects/${encodeURIComponent(S.proj.id)}/keys`, { method: "POST", body: { label } });
    toast("Clave creada"); render();
  },
  async "key-rotate"(d) {
    if (!(await ask({ title: `Cambiar la clave «${d.label}»`, text: "Se crea una clave nueva y la vieja deja de servir al momento: los jugadores que la usan se desconectan. Los datos del juego no se pierden. Acuérdate de poner la nueva en tu juego.", confirm: "Cambiar clave", danger: true }))) return;
    const r = await dev(`/api/dev/keys/${encodeURIComponent(d.uuid)}/rotate`, { method: "POST" });
    copy(r.uuid, "Clave nueva creada y copiada"); render();
  },
  async "key-pause"(d) {
    const pause = d.active === "1";
    if (pause && !(await ask({ title: "Pausar clave", text: "Los jugadores que la usan se desconectan hasta que la reanudes.", confirm: "Pausar", danger: true }))) return;
    await dev(`/api/dev/keys/${encodeURIComponent(d.uuid)}`, { method: "PUT", body: { active: !pause } });
    toast(pause ? "Clave pausada" : "Clave activa otra vez"); render();
  },
  async "key-del"(d) {
    if (!(await ask({ title: `Borrar la clave «${d.label}»`, text: "Los jugadores que la usan se desconectan y ya no podrá entrar. Los datos del proyecto se quedan.", confirm: "Borrar clave", danger: true }))) return;
    await dev(`/api/dev/keys/${encodeURIComponent(d.uuid)}`, { method: "DELETE" });
    toast("Clave borrada"); render();
  },
  async request(d) {
    await dev(`/api/dev/projects/${encodeURIComponent(S.proj.id)}/request`, { method: "POST", body: { service: d.svc } });
    toast("Pedido enviado al administrador"); render();
  },
  async "proj-rename"() {
    const name = $("#proj-name").value.trim();
    if (!name) return;
    await dev(`/api/dev/projects/${encodeURIComponent(S.proj.id)}`, { method: "PUT", body: { name } });
    toast("Nombre guardado"); render();
  },
  async "proj-del"() {
    const P = S.proj;
    if (!(await ask({ title: `Borrar ${P.name}`, text: "Se borran sus claves, la base de datos y los objetos del mundo. No se puede deshacer.", mustType: P.name, confirm: "Borrar para siempre", danger: true }))) return;
    await dev(`/api/dev/projects/${encodeURIComponent(P.id)}`, { method: "DELETE" });
    toast("Proyecto borrado"); location.hash = "#/proyectos";
  },

  // Admin
  async "svc-toggle"(d) {
    await adm(`/api/admin/projects/${encodeURIComponent(d.pid)}`, { method: "PUT", body: { [d.svc]: d.on !== "1" } });
    toast("Guardado"); render();
  },
  async "adm-proj-del"(d) {
    if (!(await ask({ title: `Borrar ${d.name}`, text: "Se borran sus claves, base de datos y mundo, y se desconecta a sus jugadores.", mustType: d.name, confirm: "Borrar proyecto", danger: true }))) return;
    await adm(`/api/admin/projects/${encodeURIComponent(d.pid)}`, { method: "DELETE" });
    toast("Proyecto borrado"); render();
  },
  async "adm-key-new"() {
    const name = await ask({ title: "Nueva clave", text: "Se crea un proyecto nuevo tuyo (de admin) con esta clave.", label: "Nombre del proyecto", confirm: "Crear" });
    if (!name) return;
    const r = await adm("/api/admin/keys", { method: "POST", body: { projectName: name } });
    copy(r.uuid, "Clave creada y copiada"); render();
  },
  async "adm-key-toggle"(d) {
    await adm(`/api/admin/keys/${encodeURIComponent(d.uuid)}`, { method: "PUT", body: { active: d.on !== "1" } });
    toast(d.on === "1" ? "Clave pausada" : "Clave activa"); render();
  },
  async "adm-key-del"(d) {
    if (!(await ask({ title: "Borrar clave", text: "Los jugadores que la usan se desconectan.", confirm: "Borrar", danger: true }))) return;
    await adm(`/api/admin/keys/${encodeURIComponent(d.uuid)}`, { method: "DELETE" });
    toast("Clave borrada"); render();
  },
  async "adm-game-del"(d) {
    if (!(await ask({ title: "Borrar juego", text: `Se borran la base de datos y el mundo de <b>${esc(d.ns)}</b>. Solo se puede si no tiene salas abiertas.`, mustType: d.ns, confirm: "Borrar", danger: true }))) return;
    await adm(`/api/admin/game/${encodeURIComponent(d.ns)}`, { method: "DELETE" });
    toast("Juego borrado"); S.sel["adb"] = ""; render();
  },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.tagName === "SELECT") return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(el.dataset, el)).catch(fail);
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.act === "ns-pick") { S.sel[el.dataset.sel] = { ns: el.value }; render(); }
  if (el.dataset.act === "adb-pick") { S.sel["adb"] = el.value; render(); }
});
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act=wroom-pick]");
  if (el) { S.sel[el.dataset.sel].room = el.dataset.room; render(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") for (const id of ["auth-modal", "json-modal"]) $("#" + id).hidden = true;
});

render();
</script>
</body>
</html>
